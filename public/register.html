

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | ChickConnect</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <header class="site-header">
      <a class="brand" href="#home" aria-label="ChickConnect home">
        <span class="brand-mark">C</span>
        <span>Chick<span>Connect</span></span>
      </a>

       <a href="index.html" class="back-home">
            Home
        </a>

        <a href="index.html#shop" class="nav-link">Shop</a>
        <a href="index.html#farmers" class="nav-link">For Farmers</a>
        <a href="index.html#buyers" class="nav-link">For Buyers</a>
        <a href="index.html#about" class="nav-link">About Us</a>
    </header>

    <main class="auth-section">

        <div class="auth-card">

            <div class="auth-heading">
                <h1>Create Your Account</h1>

                <p>
                    Join ChickConnect and connect with the
                    chicken marketplace.
                </p>
            </div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="full_name">Full Name</label>
                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="e.g. Douala, Cameroon"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="8"
                        required
                    >
                </div>

                <button type="submit" class="auth-button">
                    Create Account
                </button>

                <p id="registerMessage" class="auth-message"></p>

            </form>

            <div class="auth-footer">
                Already have an account?
                <a href="login.html">Login here</a>
            </div>

        </div>

    </main>

    <script src="js/auth.js"></script>

</body>
</html>
