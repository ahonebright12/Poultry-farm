

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ChickConnect</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-page">

    <header class="auth-navbar">
        <a class="brand" href="#home" aria-label="ChickConnect home">
        <span class="brand-mark">C</span>
        <span>Chick<span>Connect</span></span>
      </a>

        <a href="index.html" class="back-home">
            Home
        </a>

        <a href="index.html#shop" class="nav-link">Shop</a>
        <a href="index.html#farmers" class="nav-link">For Farmers</a>
        <a href="index.html#buyers" class="nav-link">For Buyers</a>
        <a href="index.html#about" class="nav-link">About Us</a>
    </header>

    <main class="auth-section">

        <div class="auth-card">

            <div class="auth-heading">
                <h1>Welcome Back!</h1>
                <p>Login to connect with chicken farmers and buyers.</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="auth-button">
                    Login to ChickConnect
                </button>

                <p id="loginMessage" class="auth-message"></p>

            </form>

            <div class="auth-footer">
                <p>Don't have an account?
                    <a href="register.html">Create Account</a>
                </p>
            </div>

        </div>

    </main>

    <script src="js/auth.js"></script>

</body>
</html>
